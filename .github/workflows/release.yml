name: Release latest main

on:
  workflow_dispatch:

permissions:
  contents: read

# Serialise all versions so two releases cannot race to become Latest.
concurrency:
  group: cadence-production-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Select latest main and verify unused release version
    runs-on: macos-15
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      release_tag: ${{ steps.source.outputs.release_tag }}
    steps:
      - name: Require dispatch from the trusted main workflow
        run: '[[ "$GITHUB_REF" == refs/heads/main ]]'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Install release metadata prerequisite
        run: brew install jq
      - name: Pin latest main and validate before builds or Apple submissions
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SOURCE_COMMIT=$(git rev-parse --verify HEAD)
          RELEASE_TAG="v$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          export SOURCE_COMMIT RELEASE_TAG
          ./scripts/verify-release-tag.sh --allow-missing-tag
          printf 'source_sha=%s\nrelease_tag=%s\n' "$SOURCE_COMMIT" "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'Releasing %s from main commit %s.\n' "$RELEASE_TAG" "$SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"

  distribution:
    name: Test, build, sign, notarize, and verify universal installer
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/distribution.yml
    secrets: inherit
    with:
      authorize_notarization: true
      source_sha: ${{ needs.preflight.outputs.source_sha }}
      release_tag: ${{ needs.preflight.outputs.release_tag }}

  publish:
    name: Verify uploaded bytes and publish production release
    needs: [preflight, distribution]
    runs-on: macos-15
    timeout-minutes: 20
    env:
      SOURCE_COMMIT: ${{ needs.preflight.outputs.source_sha }}
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
    permissions:
      contents: write
    environment:
      name: production
      url: ${{ steps.publish.outputs.release_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the immutable signed artifact ID
        env:
          ARTIFACT_ID: ${{ needs.distribution.outputs.artifact_id }}
        run: '[[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.distribution.outputs.artifact_id }}
          path: ${{ runner.temp }}/cadence-production
          merge-multiple: true
      - name: Recheck production tag and release eligibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify-release-tag.sh --allow-missing-tag
      - name: Create version tag and draft, verify uploaded bytes, then publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/cadence-production
        run: ./scripts/publish-release.sh "$RELEASE_TAG" "$RELEASE_DIRECTORY"
