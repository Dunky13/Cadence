name: macOS CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source commit to test and package
        required: false
        default: ''
        type: string
    outputs:
      artifact_id:
        description: Immutable universal build artifact from this run
        value: ${{ jobs.universal.outputs.artifact_id }}

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.source_sha || github.sha }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  native:
    name: Native macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    env:
      CI_EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Install validation tools
        run: brew install actionlint shellcheck jq
      # Immutable public fixture: exercise the release scripts before they reach
      # main. This job has no signing environment, secrets, or write permissions.
      - name: Verify existing public release through native first-open and demo startup
        env:
          RELEASE_TAG: v0.2.0
          SOURCE_COMMIT: 850f8c219bdb094e324a3d47e27ff0dfb21ca103
          EXPECTED_TEAM_ID: U9GXK89565
          EXPECTED_NATIVE_ARCH: ${{ matrix.arch }}
          LAUNCH_UI_ALLOW_NORMAL_OPEN: 'true'
          LAUNCH_UI_ENCRYPT_CLIENT_LOG: 'true'
          LAUNCH_UI_BUILD_DIR: ${{ runner.temp }}/public-launch-ui-build
          INSTALL_EVIDENCE_DIR: ${{ runner.temp }}/consumer-evidence
          LAUNCH_UI_EVIDENCE_DIR: ${{ runner.temp }}/launch-ui-evidence
        run: |
          ./scripts/build-launch-ui-observer.sh "$LAUNCH_UI_BUILD_DIR"
          ./scripts/verify-public-install.sh
      - name: Validate workflows, failure contracts, real LaunchAgents, and native build
        run: ./scripts/ci.sh
      - name: Retain native public installation regression evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Cadence-CI-Consumer-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/consumer-evidence/*
            ${{ runner.temp }}/launch-ui-evidence/status.json
            ${{ runner.temp }}/launch-ui-evidence/preflight.json
            ${{ runner.temp }}/launch-ui-evidence/bootstrap.json
            ${{ runner.temp }}/launch-ui-evidence/binding.json
            ${{ runner.temp }}/launch-ui-evidence/session.txt
            ${{ runner.temp }}/launch-ui-evidence/session-stage.json
            ${{ runner.temp }}/launch-ui-evidence/first-open.json
            ${{ runner.temp }}/launch-ui-evidence/confirmation.json
            ${{ runner.temp }}/launch-ui-evidence/observation-0.json
            ${{ runner.temp }}/launch-ui-evidence/observation-1.json
            ${{ runner.temp }}/launch-ui-evidence/observation-2.json
            ${{ runner.temp }}/launch-ui-evidence/system-*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Temporarily retain only encrypted credential-free XCTest client log
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Cadence-Encrypted-XCTest-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/launch-ui-evidence/xcode-client.cms
          if-no-files-found: warn
          retention-days: 1

  universal:
    name: Universal app and drag-and-drop installer
    needs: native
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Install packaging metadata prerequisite
        run: brew install jq
      - name: Build both architectures and verify mounted installer and copied app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/package-macos.sh universal
      - name: Store local test packages (ad-hoc signed, not notarized)
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Cadence-macOS-universal-${{ inputs.source_sha || github.sha }}
          path: dist/packages/*-universal-local/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  ci-required:
    name: ci-required
    needs: [native, universal]
    if: ${{ always() }}
    runs-on: macos-15
    timeout-minutes: 5
    env:
      NATIVE_RESULT: ${{ needs.native.result }}
      PACKAGE_RESULT: ${{ needs.universal.result }}
    steps:
      - name: Require both native runners and universal packaging
        run: |
          [[ "$NATIVE_RESULT" == success && "$PACKAGE_RESULT" == success ]]
