name: Signed macOS distribution

on:
  workflow_dispatch:
    inputs:
      authorize_notarization:
        description: Sign and submit Cadence to Apple (does not publish a release)
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      authorize_notarization:
        required: true
        type: boolean
      release_tag:
        required: true
        type: string
    outputs:
      artifact_id:
        description: Immutable verified signed distribution from this run
        value: ${{ jobs.sign.outputs.artifact_id }}

permissions:
  contents: read

concurrency:
  group: cadence-apple-signing
  cancel-in-progress: false

jobs:
  verify:
    if: inputs.authorize_notarization && (github.ref == 'refs/heads/main' || github.ref == format('refs/tags/{0}', inputs.release_tag))
    uses: ./.github/workflows/ci.yml

  sign:
    name: Developer ID, descriptive notarization, and installer verification
    needs: verify
    if: inputs.authorize_notarization && (github.ref == 'refs/heads/main' || github.ref == format('refs/tags/{0}', inputs.release_tag)) && needs.verify.result == 'success'
    runs-on: macos-15
    environment: apple-signing
    timeout-minutes: 90
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      # Matches Hikyo's working API-key client instead of the runner default.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require the immutable build artifact ID
        env:
          ARTIFACT_ID: ${{ needs.verify.outputs.artifact_id }}
        run: '[[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: ${{ runner.temp }}/cadence-unsigned
          merge-multiple: true
      - name: Install metadata validation prerequisite
        run: brew install jq
      - name: Recheck production tag before loading Apple credentials
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify-release-tag.sh
      - name: Verify exact clean build provenance before loading credentials
        env:
          INPUT: ${{ runner.temp }}/cadence-unsigned
          EXTRACTED: ${{ runner.temp }}/cadence-verified
        run: ./scripts/verify-release-input.sh "$INPUT" "$EXTRACTED"
      - name: Sign app and installer, notarize named archives, and staple tickets
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_TIMEOUT: 30m
          APP_INPUT: ${{ runner.temp }}/cadence-verified/Cadence.app
        run: ./scripts/with-apple-signing.sh ./scripts/release-macos.sh --app "$APP_INPUT" --architecture universal
      - name: Promote verified artifacts only after signing credentials are removed
        run: |
          [[ -d dist/.signed-candidate && ! -L dist/.signed-candidate ]]
          [[ ! -e dist/release && ! -L dist/release ]]
          (cd dist/.signed-candidate && shasum -a 256 --check SHA256SUMS)
          jq -e --arg commit "$GITHUB_SHA" '.schema == "cadence/distribution/v1" and .source_commit == $commit and .architecture == "universal" and .notarization == "Accepted" and .tickets == "stapled and validated"' dist/.signed-candidate/distribution.json
          mv dist/.signed-candidate dist/release
      - name: Retain notarization IDs, submitted hashes, and Apple diagnostic logs
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Cadence-Notarization-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/notarization/
          if-no-files-found: warn
          retention-days: 30
      - name: Store verified signed distribution for review (no publication)
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Cadence-Signed-macOS-universal-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
